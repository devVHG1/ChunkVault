name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_C_FLAGS=/W4 /WX"
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=${{ matrix.config }} "-DCMAKE_C_FLAGS=-Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror"
      - run: cmake --build build --config ${{ matrix.config }}
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - if: matrix.config == 'Release'
        run: cmake --install build --config ${{ matrix.config }} --prefix stage
      - if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: chunkvault-${{ matrix.os }}
          path: stage/bin/
          if-no-files-found: error
